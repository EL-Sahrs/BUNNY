<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Girlfriend's Day Mylove ❤️</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(rgba(179,0,0,0.55), rgba(179,0,0,0.55)), url('background.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: 'Georgia', serif;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }
  .card {
    max-width: 600px;
    width: 100%;
    background: #fdf6ec;
    border-radius: 20px;
    padding: 40px 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
    position: relative;
    z-index: 2;
  }
  .profile-pic {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #b30000;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    margin-bottom: 15px;
  }
  h1 {
    color: #b30000;
    font-size: 2em;
    margin-bottom: 10px;
  }
  .counter {
    margin-bottom: 20px;
    padding: 12px 20px;
    background: #fff5f5;
    border-radius: 15px;
    color: #b30000;
    font-size: 1em;
    display: inline-block;
  }
  .counter strong {
    font-size: 1.3em;
  }
  .open-btn {
    background: #b30000;
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 30px;
    font-size: 1.1em;
    font-family: 'Georgia', serif;
    font-style: italic;
    cursor: pointer;
    margin-bottom: 20px;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .open-btn:hover {
    background: #8a0000;
    transform: scale(1.05);
  }
  .message {
    display: none;
    animation: fadeIn 0.6s ease;
    text-align: left;
  }
  .message.show { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  p {
    color: #444;
    line-height: 1.6;
    font-size: 1.05em;
    min-height: 1.6em;
  }
  .signature {
    margin-top: 25px;
    font-size: 1.2em;
    color: #b30000;
    font-weight: bold;
    text-align: center;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .signature.show { opacity: 1; }
  .heart {
    font-size: 2em;
    margin: 15px 0;
    text-align: center;
  }
  .ps-btn {
    display: none;
    margin-top: 25px;
    background: none;
    border: 2px dashed #b30000;
    color: #b30000;
    padding: 8px 20px;
    border-radius: 20px;
    font-family: 'Georgia', serif;
    font-style: italic;
    cursor: pointer;
    font-size: 0.95em;
  }
  .ps-btn.show { display: inline-block; }
  .ps-msg {
    display: none;
    margin-top: 15px;
    padding: 15px;
    background: #fff5f5;
    border-left: 3px solid #b30000;
    border-radius: 8px;
    text-align: left;
    color: #a30000;
    font-style: italic;
  }
  .ps-msg.show { display: block; animation: fadeIn 0.5s ease; }
  .love-back-btn {
    display: none;
    margin-top: 20px;
    background: #ff1a1a;
    color: #fff;
    border: none;
    padding: 10px 24px;
    border-radius: 30px;
    font-family: 'Georgia', serif;
    cursor: pointer;
    font-size: 1em;
  }
  .love-back-btn.show { display: inline-block; }
  .love-reply {
    display: none;
    margin-top: 15px;
    color: #b30000;
    font-weight: bold;
    text-align: center;
  }
  .love-reply.show { display: block; }
  .falling-heart {
    position: fixed;
    top: -40px;
    font-size: 1.5em;
    pointer-events: none;
    z-index: 1;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0.3; }
  }
  @keyframes burst {
    0% { transform: scale(0); opacity: 1; }
    70% { transform: scale(1.4); opacity: 1; }
    100% { transform: scale(1.8); opacity: 0; }
  }
  .burst-heart {
    position: fixed;
    font-size: 2em;
    pointer-events: none;
    z-index: 3;
    animation: burst 1s ease-out forwards;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="profile.jpg" alt="Us" class="profile-pic">
    <h1>❤️ Happy Girlfriend's Day, Bun Bun ❤️</h1>
    <div class="counter" id="counter"></div><br>
    <button class="open-btn" id="openBtn">Open My Heart 💌</button>

    <div class="message" id="love-msg">
      <p id="line1"></p>
      <p id="line2"></p>
      <p id="line3"></p>
      <p id="line4"></p>
      <p id="line5"></p>
      <p id="line6"></p>
      <p id="line7"></p>
      <p id="line8"></p>
      <p id="line9"></p>
      <p id="line10"></p>
      <div class="heart">❤️</div>
      <div class="signature" id="sig">
        Forever Yours,<br>
        Steven ❤️
      </div>

      <div style="text-align:center;">
        <button class="ps-btn" id="psBtn">Tap for a little P.S. 🤫</button>
        <div class="ps-msg" id="psMsg">
          P.S. — You're my favorite meal, my favorite hello, and my favorite goodnight. No matter how many days pass, my love for you only grows.
        </div>

        <br>
        <button class="love-back-btn" id="loveBackBtn">Send Love Back 💕</button>
        <div class="love-reply" id="loveReply">She sent her love right back to you! ❤️❤️❤️</div>
      </div>
    </div>
  </div>

<script>
  function updateCounter() {
    const start = new Date(2026, 0, 5); // January 5, 2026
    const now = new Date();
    const diffMs = now - start;
    const totalDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    const years = Math.floor(totalDays / 365);
    const remAfterYears = totalDays % 365;
    const months = Math.floor(remAfterYears / 30);
    const days = remAfterYears % 30;

    let parts = [];
    if (years > 0) parts.push(years + (years === 1 ? " year" : " years"));
    if (months > 0) parts.push(months + (months === 1 ? " month" : " months"));
    parts.push(days + (days === 1 ? " day" : " days"));

    document.getElementById('counter').innerHTML =
      "Together for <strong>" + totalDays + " days</strong><br>(" + parts.join(", ") + ")";
  }
  updateCounter();

  const lines = [
    "Hey Bunny,",
    "I know I'm a little late wishing you a Happy Girlfriend's Day, and I'm truly sorry for that. It doesn't take away from how much you mean to me — I just wanted to make sure these words reached you the right way.",
    "Today is all about celebrating you, but the truth is that I celebrate you every single day.",
    "Thank you for loving me, believing in me, standing by my side, making me smile, and making my life brighter just by being in it.",
    "You have brought peace to my heart, happiness to my days, and countless beautiful memories that I'll cherish forever.",
    "No matter what life brings, I promise to keep choosing you, appreciating you, respecting you, and loving you with all my heart.",
    "You truly are one of the greatest blessings in my life.",
    "Happy Girlfriend's Day, Bunny, my beautiful girl. ❤️",
    "I love you more than words could ever explain.",
    "I'll be honest, I'm not really used to doing this kind of thing — but that's not an excuse. I appreciate you more than you know, and I'm deeply sorry if I ever made you feel bad. This is just a small thing I wanted to do, and I really hope it makes your day."
  ];

  function typeLine(el, text, speed, callback) {
    let i = 0;
    function step() {
      if (i <= text.length) {
        el.textContent = text.slice(0, i);
        i++;
        setTimeout(step, speed);
      } else if (callback) {
        callback();
      }
    }
    step();
  }

  function typeAll(index) {
    if (index >= lines.length) {
      document.getElementById('sig').classList.add('show');
      document.getElementById('psBtn').classList.add('show');
      document.getElementById('loveBackBtn').classList.add('show');
      return;
    }
    const el = document.getElementById('line' + (index + 1));
    typeLine(el, lines[index], 22, function() {
      setTimeout(function() { typeAll(index + 1); }, 300);
    });
  }

  function spawnHearts(count, duration) {
    const emojis = ['❤️','💕','💖','💗'];
    for (let i = 0; i < count; i++) {
      setTimeout(function() {
        const h = document.createElement('div');
        h.className = 'falling-heart';
        h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        h.style.left = Math.random() * 100 + 'vw';
        h.style.animationDuration = (4 + Math.random() * 3) + 's';
        document.body.appendChild(h);
        setTimeout(function() { h.remove(); }, 8000);
      }, i * (duration / count));
    }
  }

  document.getElementById('openBtn').addEventListener('click', function() {
    document.getElementById('love-msg').classList.add('show');
    this.style.display = 'none';
    typeAll(0);
    spawnHearts(25, 3000);
  });

  document.getElementById('psBtn').addEventListener('click', function() {
    document.getElementById('psMsg').classList.add('show');
    this.style.display = 'none';
  });

  document.getElementById('loveBackBtn').addEventListener('click', function() {
    document.getElementById('loveReply').classList.add('show');
    this.style.display = 'none';
    for (let i = 0; i < 12; i++) {
      const b = document.createElement('div');
      b.className = 'burst-heart';
      b.textContent = '❤️';
      b.style.left = (40 + Math.random() * 20) + 'vw';
      b.style.top = (40 + Math.random() * 20) + 'vh';
      document.body.appendChild(b);
      setTimeout(function() { b.remove(); }, 1000);
    }
  });
</script>
</body>
</html>
